services:
  - type: web
    name: real-mart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py && python scripts/prepare_catalogue_images.py
    startCommand: python init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: real-mart-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: AUTO_INIT_DB
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BACKUP_ENABLED
        value: "1"
      - key: DARAJA_ENV
        value: sandbox
      - key: CURRENCY
        value: KES
      - key: TIMEZONE
        value: Africa/Nairobi

databases:
  - name: real-mart-db
    databaseName: real_mart
    user: real_mart
    plan: free
