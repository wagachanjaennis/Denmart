<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Denmart Developer Access</title><style>body{margin:0;background:#101318;color:#eef2f6;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.box{width:min(420px,calc(100% - 36px));padding:28px;background:#191e26;border:1px solid #333c49;border-radius:20px}h1{margin:0 0 8px}p{color:#aab5c3}label{display:block;margin:16px 0;font-size:14px}input{box-sizing:border-box;width:100%;padding:13px;background:#0f1319;color:#fff;border:1px solid #4a5666;border-radius:10px;margin-top:7px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:800;cursor:pointer}.flash{color:#ffb5ae}</style></head><body><main class="box"><h1>Denmart developer access</h1><p>Restricted operator login for service controls and the advertisement studio.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<p class="flash">{{msg}}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="next" value="{{request.args.get('next', '')}}"><label>Operator name<input name="developer_name" autocomplete="username" required></label><label>Operator password<input type="password" name="developer_password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
