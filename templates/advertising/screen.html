<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#071b16"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/shop/manifest.webmanifest"><title>Denmart · Advertisement</title>
<link rel="stylesheet" href="{{url_for('static',filename='css/advert-player.css')}}?v=20261107-photo-price-offline-v2">
</head>
<body class="ad-screen-body">
<main class="ad-screen" tabindex="0" aria-label="Denmart advertisement screen"><canvas id="adCanvas" width="1920" height="1080" aria-label="Denmart advertisement"></canvas><video id="adUploadedVideo" playsinline muted loop hidden></video><div class="ad-video-overlay" id="adVideoOverlay" hidden><div id="adVideoFlow"></div></div></main>
<script id="adCampaign" type="application/json">{{campaign|tojson}}</script>
<script src="{{url_for('static',filename='js/advert-player.js')}}?v=20261107-photo-price-offline-v2"></script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  function warmAdvertisementCache(worker) {
    const target = worker || navigator.serviceWorker.controller;
    if (target) target.postMessage({ type: 'DENMART_CACHE_ADVERTISEMENT' });
  }
  navigator.serviceWorker.register('/shop/sw.js', { scope: '/' }).then(function (registration) {
    warmAdvertisementCache(navigator.serviceWorker.controller || registration.active || registration.waiting);
    if (!navigator.serviceWorker.controller) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        warmAdvertisementCache();
      }, { once: true });
    }
  }).catch(function () {
    // The advertisement remains playable online; browser storage may be unavailable.
  });
})();
</script>
</body></html>
