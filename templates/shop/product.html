{% extends 'base.html' %}{% block content %}<div class="crumbs"><a href="/shop">Shop</a><span>›</span>{{item.product.name}}</div><section class="product-page"><div class="product-big-photo"><img src="{{url_for('shop.product_photo', product_id=item.product.id)}}" alt="{{item.product.name}}" loading="lazy" onerror="this.onerror=null;this.src='{{url_for('shop.product_photo', product_id=item.product.id)}}?fallback=1'"></div><div class="product-detail"><div class="product-meta">{{item.product.brand or item.product.unit}}</div><h1>{{item.product.name}}</h1><p>{{item.product.description or 'Everyday supermarket essential.'}}</p><div class="detail-price">{{currency}} {{'%.2f'|format(item.selling_price|float)}}</div><div class="detail-actions"><button class="big-add" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add to basket</button><a class="basket-link" href="/cart">View basket <b data-cart-count>0</b></a></div></div></section>{% endblock %}
