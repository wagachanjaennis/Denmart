<article class="product-card"><a class="product-image product-image-clean" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}"><img loading="lazy" src="{{item.product.image_url}}" alt="{{item.product.name}}" onerror="this.onerror=null;this.src='{{url_for('shop.product_photo', product_id=item.product.id)}}?fallback=1';"></a><div class="product-info"><span class="product-brand">{{item.product.brand or 'Household'}}</span><a class="product-title" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}">{{item.product.name}}</a><div class="product-bottom"><strong>KES {{'%.0f'|format(item.selling_price|float)}}</strong><button aria-label="Add to basket" type="button" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add</button></div></div></article>
