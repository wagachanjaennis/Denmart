{% set image = product_image_url(item.product) %}<article class="product-card{% if not image %} no-product-photo{% endif %}"><a class="product-image product-image-clean" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}">{% if image %}<img loading="lazy" src="{{image}}" alt="{{item.product.name}}" referrerpolicy="no-referrer" onerror="this.closest('.product-image').classList.add('image-unavailable');this.remove();"><span class="image-unavailable-label">Image unavailable</span>{% else %}<span class="image-unavailable-label">Image unavailable</span>{% endif %}</a><div class="product-info"><span class="product-brand">{{item.product.brand or 'Household'}}</span><a class="product-title" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}">{{item.product.name}}</a><div class="product-bottom"><strong>KES {{'%.0f'|format(item.selling_price|float)}}</strong><button aria-label="Add to basket" type="button" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add</button></div></div></article>
